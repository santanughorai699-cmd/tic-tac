<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .status {
            font-size: 1.3em;
            color: #667eea;
            margin-bottom: 30px;
            height: 30px;
            font-weight: 600;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 120px);
            grid-gap: 5px;
            margin-bottom: 30px;
            background: #667eea;
            padding: 5px;
            border-radius: 10px;
        }

        .cell {
            width: 120px;
            height: 120px;
            background: white;
            border: none;
            border-radius: 8px;
            font-size: 2.5em;
            font-weight: bold;
            cursor: pointer;
            color: #667eea;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .cell:hover {
            background: #f0f0f0;
            transform: scale(1.02);
        }

        .cell:active {
            transform: scale(0.98);
        }

        .cell.x {
            color: #667eea;
        }

        .cell.o {
            color: #ff6b6b;
        }

        .cell:disabled {
            cursor: not-allowed;
        }

        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        button {
            padding: 12px 30px;
            font-size: 1em;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .reset-btn {
            background: #667eea;
            color: white;
        }

        .reset-btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(102, 126, 234, 0.4);
        }

        .mode-btn {
            background: #764ba2;
            color: white;
        }

        .mode-btn:hover {
            background: #653a8a;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(118, 75, 162, 0.4);
        }

        .mode-indicator {
            margin-top: 20px;
            font-size: 0.9em;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Tic Tac Toe</h1>
        <div class="status" id="status">Player X's Turn</div>
        
        <div class="board" id="board">
            <button class="cell" data-index="0"></button>
            <button class="cell" data-index="1"></button>
            <button class="cell" data-index="2"></button>
            <button class="cell" data-index="3"></button>
            <button class="cell" data-index="4"></button>
            <button class="cell" data-index="5"></button>
            <button class="cell" data-index="6"></button>
            <button class="cell" data-index="7"></button>
            <button class="cell" data-index="8"></button>
        </div>

        <div class="buttons">
            <button class="reset-btn" onclick="resetGame()">New Game</button>
            <button class="mode-btn" onclick="toggleMode()">vs <span id="modeText">AI</span></button>
        </div>
        
        <div class="mode-indicator">Playing against <span id="modeIndicator">AI</span></div>
    </div>

    <script>
        let gameBoard = ['', '', '', '', '', '', '', '', ''];
        let currentPlayer = 'X';
        let gameActive = true;
        let isAIMode = true;

        const winningCombinations = [
            [0, 1, 2],
            [3, 4, 5],
            [6, 7, 8],
            [0, 3, 6],
            [1, 4, 7],
            [2, 5, 8],
            [0, 4, 8],
            [2, 4, 6]
        ];

        const cells = document.querySelectorAll('.cell');
        const statusDisplay = document.getElementById('status');

        cells.forEach(cell => {
            cell.addEventListener('click', handleCellClick);
        });

        function handleCellClick(e) {
            const index = e.target.dataset.index;
            
            if (gameBoard[index] !== '' || !gameActive) return;

            gameBoard[index] = currentPlayer;
            e.target.textContent = currentPlayer;
            e.target.classList.add(currentPlayer.toLowerCase());

            if (checkWinner(currentPlayer)) {
                statusDisplay.textContent = `Player ${currentPlayer} Wins! 🎉`;
                gameActive = false;
                return;
            }

            if (gameBoard.every(cell => cell !== '')) {
                statusDisplay.textContent = "It's a Draw! 🤝";
                gameActive = false;
                return;
            }

            currentPlayer = currentPlayer === 'X' ? 'O' : 'X';

            if (isAIMode && currentPlayer === 'O' && gameActive) {
                statusDisplay.textContent = "AI is thinking...";
                setTimeout(makeAIMove, 500);
            } else {
                updateStatus();
            }
        }

        function makeAIMove() {
            const bestMove = findBestMove();
            gameBoard[bestMove] = 'O';
            cells[bestMove].textContent = 'O';
            cells[bestMove].classList.add('o');

            if (checkWinner('O')) {
                statusDisplay.textContent = "AI Wins! 🤖";
                gameActive = false;
                return;
            }

            if (gameBoard.every(cell => cell !== '')) {
                statusDisplay.textContent = "It's a Draw! 🤝";
                gameActive = false;
                return;
            }

            currentPlayer = 'X';
            updateStatus();
        }

        function findBestMove() {
            // First, try to win
            for (let i = 0; i < 9; i++) {
                if (gameBoard[i] === '') {
                    gameBoard[i] = 'O';
                    if (checkWinner('O')) {
                        gameBoard[i] = '';
                        return i;
                    }
                    gameBoard[i] = '';
                }
            }

            // Block player from winning
            for (let i = 0; i < 9; i++) {
                if (gameBoard[i] === '') {
                    gameBoard[i] = 'X';
                    if (checkWinner('X')) {
                        gameBoard[i] = '';
                        return i;
                    }
                    gameBoard[i] = '';
                }
            }

            // Take center
            if (gameBoard[4] === '') return 4;

            // Take corners
            const corners = [0, 2, 6, 8];
            const availableCorners = corners.filter(i => gameBoard[i] === '');
            if (availableCorners.length > 0) {
                return availableCorners[Math.floor(Math.random() * availableCorners.length)];
            }

            // Take any available space
            const available = gameBoard.map((cell, i) => cell === '' ? i : null).filter(i => i !== null);
            return available[Math.floor(Math.random() * available.length)];
        }

        function checkWinner(player) {
            return winningCombinations.some(combination => {
                return combination.every(index => gameBoard[index] === player);
            });
        }

        function updateStatus() {
            if (gameActive) {
                statusDisplay.textContent = `Player ${currentPlayer}'s Turn`;
            }
        }

        function resetGame() {
            gameBoard = ['', '', '', '', '', '', '', '', ''];
            currentPlayer = 'X';
            gameActive = true;
            statusDisplay.textContent = "Player X's Turn";
            
            cells.forEach(cell => {
                cell.textContent = '';
                cell.classList.remove('x', 'o');
            });
        }

        function toggleMode() {
            isAIMode = !isAIMode;
            const modeText = document.getElementById('modeText');
            const modeIndicator = document.getElementById('modeIndicator');
            
            if (isAIMode) {
                modeText.textContent = 'AI';
                modeIndicator.textContent = 'AI';
            } else {
                modeText.textContent = 'Human';
                modeIndicator.textContent = 'another Human';
            }
            
            resetGame();
        }
    </script>
</body>
</html>
